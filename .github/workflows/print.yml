name: Print name

on:
  workflow_dispatch: 
env:
  NAME: VAHEED

jobs:

  set-name-job:
    name: Set name
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.set-name.outputs.name }}

    steps:
      - name: Set name
        id: set-name
        run: echo "name=${{ env.NAME }}" >> "$GITHUB_OUTPUT"

  print-name-job:
    name: Print
    needs: set-name-job
    uses: ./.github/workflows/reusable-print.yml
    with:
      name: ${{ needs.set-name-job.outputs.name }}
