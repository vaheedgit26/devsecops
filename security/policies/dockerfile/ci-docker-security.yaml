name: DevSecOps Container Pipeline
on:
  push:
    branches:
      - main
permissions:
  contents: write
  id-token: write
env:
  AWS_REGION: us-east-1
  IMAGE_NAME: my-app
  IMAGE_TAG: ${{ github.sha }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-app
  IMAGE_TAG: ${{ github.sha }}
  ACCOUNT_ID: ""

jobs:
  
  # 1. Git Leaks Scan JOB
  gitleaks-job:
    name: Git Leaks Scan
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2

  # 2. Dockerfile Scan JOB
  dockerfile-scan-job:
    name: Dockerfile Scan
    runs-on: ubuntu-latest
    needs: 
      - gitleaks-job
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.0

      - name: Dockerfile Scan
        run: |
          trivy config Dockerfile \
          --severity HIGH,CRITICAL \
          --exit-code 1

      - name: Install Conftest
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
          tar xzf conftest_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: OPA Policy Check
        run: conftest test Dockerfile --policy docker-policy.rego

  # 3. Build and Scan Image JOB
  build-scan-job:
    name: Build and Scan Image
    runs-on: ubuntu-latest
    needs:
      - dockerfile-scan-job
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Build and Push Docker Image
        run: |
        # ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_URI=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}

          docker build -t $IMAGE_URI:${{ env.IMAGE_TAG }} .
        
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV 

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789:role/github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        run: docker push ${{ env.IMAGE_URI }}:${{ env.IMAGE_TAG }}

      - name: Get Image Digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign Sign Image
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign $IMAGE_URI@${IMAGE_DIGEST}

      - name: Update Helm values.yaml
        run: |
          FILE=apps/backend/values.yaml

          # Replace tag with digest format
          sed -i "s|tag:.*|digest: \"${IMAGE_DIGEST}\"|g" $FILE

          # Optional: ensure repository exists
          # image:
          #   repository: xxx
          #   digest: sha256:xxx


      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add apps/backend/values.yaml
          git commit -m "Update image digest to ${IMAGE_DIGEST}" || echo "No changes"
          git push
