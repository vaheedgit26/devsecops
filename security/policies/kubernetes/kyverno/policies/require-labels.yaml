apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-app-label
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-app-label
      match:
        any:
          - resources:
              kinds:
                - Pod
                - Deployment
                - StatefulSet
                - DaemonSet
                - Service
                - ConfigMap
                - Ingress
    validate:
      message: "Resource must have app label"
      pattern:
        metadata:
          labels:
            app: "?*"
