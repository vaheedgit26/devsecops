name: Terraform Security Scan (OPA)

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Install Conftest
      run: |
        wget https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
        tar xzf conftest_Linux_x86_64.tar.gz
        sudo mv conftest /usr/local/bin

    - name: Generate Terraform Plan JSON
      run: |
        chmod +x scripts/terraform-plan.sh
        ./scripts/terraform-plan.sh

    - name: Run OPA Policies (Fail on violation)
      run: |
        conftest test terraform/tfplan.json \
          --policy policy/terraform \
          --all-namespaces

    - name: Upload Plan (optional)
      uses: actions/upload-artifact@v4
      with:
        name: terraform-plan
        path: terraform/tfplan.json
