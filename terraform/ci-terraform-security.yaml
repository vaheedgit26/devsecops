name: Terraform Security Pipeline

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  terraform-security:
    runs-on: ubuntu-latest

    steps:

    # ✅ Checkout Code
    - name: Checkout
      uses: actions/checkout@v4

    # ✅ Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # ✅ Install & Run Trivy (Filesystem + IaC scan)
    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@0.24.0
      with:
        scan-type: fs
        scan-ref: terraform/
        format: table
        exit-code: '1'
        severity: HIGH,CRITICAL

    # ✅ Install & Run Checkov
    - name: Run Checkov
      uses: bridgecrewio/checkov-action@v12
      with:
        directory: terraform/
        framework: terraform
        quiet: true
        compact: true
        soft_fail: false

    # ✅ Install Conftest (OPA)
    - name: Install Conftest
      run: |
        wget https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz
        tar xzf conftest_Linux_x86_64.tar.gz
        sudo mv conftest /usr/local/bin

    # ✅ Terraform Init + Plan + JSON Output
    - name: Terraform Init & Plan
      run: |
        cd terraform
        terraform init -input=false
        terraform plan -out=tfplan.binary -input=false
        terraform show -json tfplan.binary > tfplan.json

    # ✅ Run OPA Policies
    - name: Run Conftest (OPA Policies)
      run: |
        conftest test terraform/tfplan.json \
          --policy policy/terraform \
          --output table
