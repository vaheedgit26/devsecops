name: CI/CD — backend

# Triggers on push to develop / release branches only.
# Feature branches and PRs → ci-pr-api-gateway.yml
#
# Jobs:
#   build       → Maven + SAST + Docker + ECR + Cosign
#   deploy-dev  → direct commit to envs/dev/ → ArgoCD auto-syncs → smoke test
#   open-qa-pr  → opens a PR in zen-gitops for envs/qa/ (PR merge = QA deployment)
#
#
# PROD promotion → promote-prod.yml (workflow_dispatch)

on:
  push:
    branches: [develop, 'release/**']
    paths:
      - 'backend/**'
      - '.github/workflows/02-ci-backend.yml'

permissions:
  id-token: write
  contents: read
  security-events: write
  actions: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: api-gateway
  GITOPS_REPO: ${{ vars.GITOPS_REPO }}

jobs:
  Build-Job: 
    name: Build Job
    uses: ./.github/workflows/_go-build.yml
    with: 
      service-name: backend
    
      sonarqube-scan: true
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
      secrets:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      dockerfile: backend/Dockerfile
      build-context: backend
      ecr-uri:
