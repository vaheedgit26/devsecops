# =======================================================================================
# Reusable — Go Build + SAST + Container Security + ECR Push + Cosign + SBOM + GitOps PR          
# =======================================================================================

name: Reusable — GO Build & Security Gates

on:
  workflow_call:

    inputs:

      # ======================================================
      # General
      # ======================================================

      service-name:
        description: "Service Name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      # ======================================================
      # Application Scans
      # ======================================================

      gitleaks-scan:
        description: "Enable Gitleaks Scan"
        required: false
        type: boolean
        default: false

      trivy-fs-scan:
        description: "Enable Trivy FS Scan"
        required: false
        type: boolean
        default: false

      codeql-scan:
        description: "Enable CodeQL Scan"
        required: false
        type: boolean
        default: false

      sonarqube-scan:
        description: "Enable SonarQube Scan"
        required: false
        type: boolean
        default: false

      sonar-host-url:
        description: "SonarQube Host URL"
        required: false
        type: string
        default: ""

      # ======================================================
      # Dockerfile Scans
      # ======================================================

      dockerfile-scan:
        description: "Enable Dockerfile Scanning"
        required: false
        type: boolean
        default: false

      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string

      build-context:
        description: "Docker build context"
        required: false
        type: string

      hadolint-dockerfile-scan:
        description: "Enable Hadolint Dockerfile Scan"
        required: false
        type: boolean
        default: false

      trivy-dockerfile-scan:
        description: "Enable Trivy Dockerfile Scan"
        required: false
        type: boolean
        default: false

      opa-conftest-dockerfile-scan:
        description: "Enable OPA Conftest Dockerfile Scan"
        required: false
        type: boolean
        default: false

      # ======================================================
      # Image Build
      # ======================================================

      image-build:
        description: "Enable Image Build"
        required: false
        type: boolean
        default: false

      ecr-registry:
        description: "ECR Registry URL"
        required: false
        type: string
        default: ""

      ecr-repository:
        description: "ECR Repository"
        required: false
        type: string
        default: ""

      aws-region:
        description: "AWS Region"
        required: false
        type: string
        default: ""

      aws-ecr-role-arn:
        description: "AWS ECR Role ARN"
        required: false
        type: string
        default: ""

      # ======================================================
      # Image Security
      # ======================================================

      image-sign:
        description: "Enable Image Signing"
        required: false
        type: boolean
        default: false

      image-sbom:
        description: "Enable SBOM Generation and Attestation"
        required: false
        type: boolean
        default: false

      # ======================================================
      # GitOps
      # ======================================================

      gitops-repo:
        description: "GitOps Repository"
        required: false
        type: string
        default: ""

      helm-values-file:
        description: "Path to Helm values.yaml inside GitOps repo"
        required: false
        type: string
        default: ""

    # ==========================================================
    # Secrets
    # ==========================================================

    secrets:

      SONAR_TOKEN:
        required: false

      GITOPS_TOKEN:
        required: true


jobs:

  # ============================================================
  # 1. PR CHECK
  # ============================================================

  Pr-Check-Job:
    name: PR Check Job

    uses: ./.github/workflows/_go-pr-check.yml

    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}

      gitleaks-scan: ${{ inputs.gitleaks-scan }}
      trivy-fs-scan: ${{ inputs.trivy-fs-scan }}
      codeql-scan: ${{ inputs.codeql-scan }}

      sonarqube-scan: ${{ inputs.sonarqube-scan }}
      sonar-host-url: ${{ inputs.sonar-host-url }}

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # 2. DOCKERFILE SCAN
  # ============================================================

  Dockerfile-Scan-Job:
    name: Dockerfile Scan Job

    if: ${{ inputs.dockerfile-scan }}

    uses: ./.github/workflows/reusable-dockerfile-scan.yml

    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}

      dockerfile: ${{ inputs.dockerfile }}

      hadolint-dockerfile-scan: ${{ inputs.hadolint-dockerfile-scan }}     
      trivy-dockerfile-scan: ${{ inputs.trivy-dockerfile-scan }}        
      opa-conftest-dockerfile-scan: ${{ inputs.opa-conftest-dockerfile-scan }}
        
  # ============================================================
  # 3. BUILD + SCAN + PUSH IMAGE
  # ============================================================

  Image-Build-Scan-Push-Job:
    name: Docker Image Build-Scan-Push Job

    if: ${{ inputs.image-build }}

    needs:
      - Pr-Check-Job
      - Dockerfile-Scan-Job

    uses: ./.github/workflows/reusable-image-build.yaml

    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}

      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}

      ecr-registry: ${{ inputs.ecr-registry }}
      ecr-repository: ${{ inputs.ecr-repository }}

      aws-region: ${{ inputs.aws-region }}
      aws-ecr-role-arn: ${{ inputs.aws-ecr-role-arn }}

  # ============================================================
  # 4. COSIGN IMAGE SIGNING
  # ============================================================

  Image-Sign-Job:
    name: Image Sign

    if: ${{ inputs.image-sign }}

    needs:
      - Image-Build-Scan-Push-Job

    uses: ./.github/workflows/reusable-image-sign.yml

    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}

      image-with-digest: ${{ needs.Image-Build-Scan-Push-Job.outputs.image_with_digest }}
        
      aws-region: ${{ inputs.aws-region }}
      aws-ecr-role-arn: ${{ inputs.aws-ecr-role-arn }}

  # ============================================================
  # 5. SBOM GENERATION + ATTESTATION
  # ============================================================

  Generate-Attest-SBOM-Job:
    name: Generate and Attest SBOM

    if: ${{ inputs.image-sbom }}

    needs:
      - Image-Build-Scan-Push-Job

    uses: ./.github/workflows/reusable-sbom.yml

    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}

      image-with-digest: ${{ needs.Image-Build-Scan-Push-Job.outputs.image_with_digest }}
        
      aws-region: ${{ inputs.aws-region }}
      aws-ecr-role-arn: ${{ inputs.aws-ecr-role-arn }}

  # ============================================================
  # 6. UPDATE GITOPS + CREATE PR
  # ============================================================

  Update-Helm-Values-Pr-Job:
    name: Update Helm Values and Create PR

    if: ${{ inputs.image-build }}

    needs:
      - Image-Build-Scan-Push-Job

    uses: ./.github/workflows/reusable-update-helm-values.yml

    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}

      gitops-repo: ${{ inputs.gitops-repo }}

      helm-values-file: ${{ inputs.helm-values-file }}
      image: ${{ needs.Image-Build-Scan-Push-Job.outputs.image }}        
      image-digest: ${{ needs.Image-Build-Scan-Push-Job.outputs.image_digest }}
        
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
