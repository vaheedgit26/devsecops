# Reusable — Java Build + SAST + Container Security + ECR Push + Cosign Sign
name: Reusable — GO Build & Security Gates

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
  
jobs:
  Pr-Check-Job:
    name: PR Check Job
    uses: ./.github/workflows/_go-pr-check.yml
    with:
      service-name: ${{ inputs.service-name }}
      sonarqube-scan: true
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
            
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
