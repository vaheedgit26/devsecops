# Reusable — Go Build + SAST + Container Security + ECR Push + Cosign Sign
name: Reusable — GO Build & Security Gates

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      # ---------------- Sonarqube -------------------------
      sonarqube-scan: 
        required: false
        type: boolean
        
      sonar-host-url:
        required: false
        type: string
        
      # --------------- Image Build -------------------------
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string

      build-context:
        description: "Image build context"
        required: true
        type: string

      ecr-uri:
        description: "Complete ECR URI"
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: false
  
jobs:
  Pr-Check-Job:
    name: PR Check Job
    uses: ./.github/workflows/_go-pr-check.yml
    with:
      service-name: ${{ inputs.service-name }}
      sonarqube-scan: ${{ inputs.sonarqube-scan }}
      sonar-host-url: ${{ inputs.sonar-host-url }}
            
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Dockerfile-Scan-Job:
    name: Dockerfile Scan Job
    uses: ./.github/workflows/reusable-dockerfile-scan.yml
    with:
      service-name: ${{ inputs.service-name }}
      dockerfile: ${{ inputs.dockerfile }}
      trivy-scan: true

  Image-Build-Job:
    name: Docker Image Build Job
    needs: [Pr-Check-Job, Dockerfile-Scan-Job]
    uses: ./.github/workflows/reusable-image-build.yaml
    with: 
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      ecr-uri: ${{ inputs.ecr-uri }}
      
