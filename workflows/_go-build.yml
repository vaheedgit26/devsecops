# Reusable — Go Build + SAST + Container Security + ECR Push + Cosign Sign
name: Reusable — GO Build & Security Gates

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      # ---------------- SonarQube ------------------------- #
      sonarqube-scan:
        required: false
        type: boolean
        default: false

      sonar-host-url:
        required: false
        type: string

      # --------------- Image Build ------------------------- #
      dockerfile:
        description: "Path to Dockerfile"
        required: true
        type: string

      build-context:
        description: "Image build context"
        required: true
        type: string

      # --------------- Image Scans ------------------------- #
      hadolint-scan:
        description: "Enable Hadolint Dockerfile Scan"
        required: false
        type: boolean
        default: false

      trivy-scan:
        description: "Enable Hadolint Dockerfile Scan"
        required: false
        type: boolean
        default: false

      opa-conftest-scan:
        description: "Enable Trivy Dockerfile Scan"
        required: false
        type: boolean
        default: false
      # ----------------------------------------------------- #
        
      ecr-registry:
        description: "ECR Registry URL"
        required: true
        type: string

      ecr-repository:
        description: "ECR Repository"
        required: true
        type: string

      aws-region:
        description: "AWS Region to push Docker Image"
        required: true
        type: string

      aws-ecr-role-arn:
        description: "Role ARN to push ECR Image"
        required: true
        type: string

      image-sign:
        description: "Enable Image Signing"
        required: false
        type: boolean

      image-sbom:
        description: "Enable SBOM generation"
        required: false
        type: boolean

    secrets:
      SONAR_TOKEN:
        required: false

jobs:

  Pr-Check-Job:
    name: PR Check Job
    uses: ./.github/workflows/_go-pr-check.yml
    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}
      sonarqube-scan: ${{ inputs.sonarqube-scan }}
      sonar-host-url: ${{ inputs.sonar-host-url }}

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Dockerfile-Scan-Job:
    name: Dockerfile Scan Job
    uses: ./.github/workflows/reusable-dockerfile-scan.yml
    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}
      dockerfile: ${{ inputs.dockerfile }}
      hadolint-scan: ${{ inputs.hadolint-scan }}
      trivy-scan: ${{ inputs.trivy-scan }}
      opa-conftest-scan: ${{ inputs.opa-conftest-scan }}

  Image-Build-Job:
    name: Docker Image Build Job
    needs:
      - Pr-Check-Job
      - Dockerfile-Scan-Job
    uses: ./.github/workflows/reusable-image-build.yaml
    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}
      dockerfile: ${{ inputs.dockerfile }}
      build-context: ${{ inputs.build-context }}
      ecr-registry: ${{ inputs.ecr-registry }}
      ecr-repository: ${{ inputs.ecr-repository }}
      aws-region: ${{ inputs.aws-region }}
      aws-ecr-role-arn: ${{ inputs.aws-ecr-role-arn }}

  Image-Sign-Job:
    if: ${{ inputs.image-sign }}
    name: Image Sign
    needs: 
      - Image-Build-Job
    uses: ./.github/workflows/reusable-image-sign.yml
    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}
      image-with-digest: ${{ needs.Image-Build-Job.outputs.image_with_digest }}
      aws-region: ${{ inputs.aws-region }}
      aws-ecr-role-arn: ${{ inputs.aws-ecr-role-arn }}

  Generate-Attest-SBOM-Job:
    if: ${{ inputs.image-sbom }}
    name: Generate and Attest SBOM
    needs:
      - Image-Build-Job
    uses: ./.github/workflows/reusable-sbom.yml
    with:
      service-name: ${{ inputs.service-name }}
      runner: ${{ inputs.runner }}
      image-with-digest: ${{ needs.Image-Build-Job.outputs.image_with_digest }}
      aws-region: ${{ inputs.aws-region }}
      aws-ecr-role-arn: ${{ inputs.aws-ecr-role-arn }}
