name: CICD - GO Services 

on:
  push:
    branches: [develop, 'release/**']
      
  paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  
  Gitleaks-Job:
    name: Gitleaks
    uses: ./.github/workflows/reusable-gitleaks.yml
    with:
      service-name: backend 
    # secrets: inherit

  Sonarqube-Job:
    name: Sonarqube
    uses: ./.github/workflows/reusable-sonarqube.yml
    with:
      service-name: backend
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
            
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Trivy-Fs-Scan-Job:
    name: Trivy Fs Scan
    uses: ./.github/workflows/reusable-trivy-fs.yml
    with:
      service-name: backend
