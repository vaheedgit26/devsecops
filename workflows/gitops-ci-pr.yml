name: GitOps CI - Helm + Kubernetes Security

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'envs/**'
      - '.github/workflows/gitops-ci-pr.yml'

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  TRIVY_VERSION: v0.72.0
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  
jobs:

  GitOps-Validation:
    name: Helm + Kubernetes Security Validation
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout GitOps Repository
      # ======================================================

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6

      # ======================================================
      # 2. Setup Helm
      # ======================================================

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # ======================================================
      # 3. Helm Lint
      # ======================================================

      - name: Helm Lint
        run: |
          helm lint \
            ./charts/backend \
            -f envs/dev/values-backend.yaml

      # ======================================================
      # 4. Render Helm Templates
      # ======================================================

      - name: Render Helm Manifests
        run: |
          mkdir -p rendered/backend

          helm template backend \
            ./charts/backend \
            -f envs/dev/values-backend.yaml \
            > rendered/backend/backend.yaml

          echo "Helm rendering completed successfully."

      # ======================================================
      # 5. Show Rendered Kubernetes Manifests
      # ======================================================

      - name: Show Rendered Kubernetes Manifests
        run: |
          echo "=================================================="
          echo "Rendered Kubernetes Manifests"
          echo "=================================================="

          cat rendered/backend/backend.yaml

      # ======================================================
      # 6. Install Kubeconform
      # ======================================================

      - name: Install Kubeconform
        run: |
          set -e

          KUBECONFORM_URL: "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"

          echo "Downloading Kubeconform ${KUBECONFORM_VERSION}..."

          curl -fsSL \
            "$KUBECONFORM_URL" \
            -o /tmp/kubeconform.tar.gz

          echo "Extracting Kubeconform..."

          tar -xzf /tmp/kubeconform.tar.gz \
            -C /tmp

          sudo install \
            /tmp/kubeconform \
            /usr/local/bin/kubeconform

          echo "Kubeconform version:"
          kubeconform -v

      # ======================================================
      # 7. Kubeconform - Kubernetes Schema Validation
      # ======================================================

      - name: Kubeconform - Kubernetes Schema Validation
        run: |
          kubeconform \
            -strict \
            -summary \
            -output text \
            rendered/backend/backend.yaml

      # ======================================================
      # 8. Setup Trivy
      # ======================================================

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}

      # ======================================================
      # 9. Trivy - Kubernetes Security Scan
      # ======================================================

      - name: Trivy - Kubernetes Manifest Security Scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            rendered/

      # ======================================================
      # 10. Generate Trivy SARIF
      # ======================================================

      - name: Generate Trivy SARIF
        if: always()
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-kubernetes.sarif \
            rendered/

      # ======================================================
      # 11. Upload Trivy SARIF to GitHub Security
      # ======================================================

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-kubernetes.sarif
          category: trivy-kubernetes-manifests
