name: GitOps CI - Helm Render + Kubernetes Security Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'envs/**'
      - 'charts/**'
      - 'helm/**'
      - '.github/workflows/gitops-ci.yml'

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  TRIVY_VERSION: v0.72.0

jobs:

  # ============================================================
  # 1. Render Helm charts
  # ============================================================

  Helm-Render:
    name: Helm Render
    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      # --------------------------------------------------------
      # Render backend Helm chart
      # --------------------------------------------------------

      - name: Render Backend Helm Chart
        run: |
          mkdir -p rendered/backend

          helm template backend ./charts/backend \
            -f envs/dev/values-backend.yaml \
            > rendered/backend/backend.yaml

      # --------------------------------------------------------
      # Show rendered manifests
      # --------------------------------------------------------

      - name: Show Rendered Manifests
        run: |
          cat rendered/backend/backend.yaml

      # --------------------------------------------------------
      # Upload rendered manifests for next job
      # --------------------------------------------------------

      - name: Upload Rendered Manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-kubernetes-manifests
          path: rendered/


  # ============================================================
  # 2. Trivy Kubernetes Manifest Scan
  # ============================================================

  Trivy-Kubernetes-Scan:
    name: Trivy Kubernetes Manifest Scan
    runs-on: ubuntu-latest
    needs:
      - Helm-Render

    steps:

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6

      - name: Download Rendered Manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-kubernetes-manifests
          path: rendered/

      # --------------------------------------------------------
      # Install Trivy
      # --------------------------------------------------------

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}

      # --------------------------------------------------------
      # Trivy Kubernetes configuration scan
      # --------------------------------------------------------

      - name: Trivy - Kubernetes Manifest Scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            rendered/

      # --------------------------------------------------------
      # Generate SARIF
      # --------------------------------------------------------

      - name: Trivy - Generate SARIF
        if: always()
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-kubernetes.sarif \
            rendered/

      # --------------------------------------------------------
      # Upload SARIF
      # --------------------------------------------------------

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-kubernetes.sarif
          category: trivy-kubernetes-manifests


  # ============================================================
  # 3. Helm lint
  # ============================================================

  Helm-Lint:
    name: Helm Lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Helm Lint
        run: |
          helm lint \
            ./charts/backend \
            -f envs/dev/values-backend.yaml
