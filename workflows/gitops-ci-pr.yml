name: GitOps CI - Helm + Kubernetes Security

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'envs/**'
      - '.github/workflows/gitops-ci.yml'

permissions:
  contents: read
  security-events: write
  pull-requests: read

env:
  TRIVY_VERSION: v0.72.0
  HELM_VERSION: v3.19.0

jobs:

  GitOps-Validation:
    name: Helm + Kubernetes Security Validation
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout GitOps Repository
        uses: actions/checkout@v6

      # ======================================================
      # Helm
      # ======================================================

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      # ======================================================
      # Helm Lint
      # ======================================================

      - name: Helm Lint
        run: |
          helm lint \
            ./charts/backend \
            -f envs/dev/values-backend.yaml

      # ======================================================
      # Render Helm Templates
      # ======================================================

      - name: Render Helm Manifests
        run: |
          mkdir -p rendered/backend

          helm template backend \
            ./charts/backend \
            -f envs/dev/values-backend.yaml \
            > rendered/backend/backend.yaml

      # ======================================================
      # Show rendered manifests
      # ======================================================

      - name: Show Rendered Kubernetes Manifests
        run: |
          cat rendered/backend/backend.yaml

      # ======================================================
      # Trivy Setup
      # ======================================================

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}

      # ======================================================
      # Trivy Kubernetes Configuration Scan
      # ======================================================

      - name: Trivy Kubernetes Manifest Scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            rendered/

      # ======================================================
      # Generate SARIF
      # ======================================================

      - name: Generate Trivy SARIF
        if: always()
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy-kubernetes.sarif \
            rendered/

      # ======================================================
      # Upload SARIF
      # ======================================================

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-kubernetes.sarif
          category: trivy-kubernetes-manifests
