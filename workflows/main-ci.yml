name: CICD - GO Services 

on:
  push:
    branches: [develop, 'release/**']
      
  paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

# permissions:
#   contents: read
#   pull-requests: read
#   security-events: write
#   actions: read
#   id-token: write

jobs:
  # ── 1. Build: Gitleaks · Sonarqube · Sonarqube · Trivy · ECR · Cosign ──
  gitleaks:
    name: Gitleaks
     uses: ./.github/workflows/gitleaks.yml
    with:
      service-name: backend
      
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      
    secrets: inherit

  # ── 2. Deploy to DEV (direct commit — ArgoCD auto-syncs) ──────────────
  deploy-dev:
    name: Deploy — DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: _gitops

      - name: Update image tag — DEV
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i \
            "_gitops/envs/dev/values-api-gateway.yaml"
          cd _gitops
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet && echo "Already up to date" && exit 0
          git commit -m "ci(dev): update api-gateway → ${IMAGE_TAG}"
          git push
