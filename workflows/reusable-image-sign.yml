name: Reusable - Cosign Sign Image

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest

      image-with-digest:
        description: "Complete ECR image reference with digest"
        required: true
        type: string

      aws-region:
        description: "AWS Region"
        required: true
        type: string

      aws-ecr-role-arn:
        description: "Complete AWS ECR Role ARN"
        required: true
        type: string

jobs:

  Sign-Image:
    name: Sign Image with Cosign
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Verify AWS CLI
        run: aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-ecr-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify image reference
        run: |
          echo "Service: ${{ inputs.service-name }}"
          echo "Image: ${{ inputs.image-with-digest }}"
          
      # ── Cosign keyless sign ────────────────────────────────────────────────────
      # GitHub OIDC token → Fulcio CA issues short-lived cert → Rekor audit log entry
      # No long-lived signing keys. Kyverno policy in EKS verifies signature at admission.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Cosign — Sign image (keyless, GitHub OIDC → Fulcio → Rekor)
        run: cosign sign --yes "${{ inputs.image-with-digest }}" 
