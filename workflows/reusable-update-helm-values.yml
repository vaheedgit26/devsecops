name: Reusable - Update Helm Values

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service name"
        required: true
        type: string

      runner:
        description: "Runner label"
        required: false
        type: string
        default: ubuntu-latest
        
      gitops-repo:
        description: "GiOps Repository"
        required: true
        type: string

      helm-values-file:
        description: "Path to Helm values.yaml"
        required: true
        type: string

      image:
        description: "Image"
        required: true
        type: string

      image-digest:
        description: "Image Digest"
        required: true
        type: string

    secrets:
      GITOPS_TOKEN:
        required: true
      
jobs:

  Update-Helm-Values-Job:
    name: Update Helm Values
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read

    env:
      GITOPS_DIR: "_gitops"
      VALUES_FILE: "${{ inputs.helm-values-file }}"

    steps:
      # --------------------------------------------------
      # Checkout GitOps repository
      # --------------------------------------------------
      
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.gitops-repo }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: ${{ env.GITOPS_DIR }}
          
      # --------------------------------------------------
      # Verify helm values file
      # --------------------------------------------------
      
      - name: Verify values file
        # working-directory: "$GITOPS_DIR"
        run: |
          if [ ! -f "$GITOPS_DIR/$VALUES_FILE" ]; then
            echo "ERROR: Values file not found: $GITOPS_DIR/$VALUES_FILE"
            exit 1
          fi
          echo "Values file found: $GITOPS_DIR/$VALUES_FILE"

      # --------------------------------------------------
      # Image and Digest
      # --------------------------------------------------
      
      - name: Print DIGEST and IMAGE WITH DIGEST
        run: |
          echo "Image DIGEST: ${{ inputs.image-digest }}"
          echo "Image with DIGEST: ${{ inputs.image-with-digest }}"
          
      # --------------------------------------------------
      # Update Helm values
      # --------------------------------------------------
      
      - name: Update image DIGEST in manifest
        run: |
          IMAGE="${{ inputs.image }}"
          DIGEST="${{ inputs.image-digest }}"

          echo "-----------Updating:---------------"
          echo "  File   : $GITOPS_DIR/$VALUES_FILE"
          echo "  Image  : $IMAGE"
          echo "  Digest : $DIGEST"
          echo "-----------------------------------"
          
          sed -i "s|digest: .*|digest: $DIGEST|g" $GITOPS_DIR/$VALUES_FILE

      # --------------------------------------------------
      # Show updated values
      # --------------------------------------------------    
      
      - name: Show updated manifest (debug)
        run: |
          cat "$GITOPS_DIR/$VALUES_FILE"
          
      # --------------------------------------------------
      # Show changes
      # --------------------------------------------------
      
      - name: Show Git diff
        run: git diff -- "$GITOPS_DIR/$VALUES_FILE"

      # --------------------------------------------------
      # Create GitOps Branch
      # --------------------------------------------------
      
      - name: Create GitOps Branch
        id: branch
        run: |
          BRANCH="ci/update-${{ inputs.service-name }}-${GITHUB_SHA::7}"
          
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          
      # --------------------------------------------------
      # Commit & Push changes
      # --------------------------------------------------
      
      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$GITOPS_DIR/$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore(gitops): update ${{ inputs.service-name }} image to ${DIGEST:0:12}"

          git push origin "${{ steps.branch.outputs.branch }}"

      # --------------------------------------------------
      # Create Pull Request
      # --------------------------------------------------
      
      - name: Create GitOps Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          GITOPS_REPO: ${{ inputs.gitops-repo }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          SERVICE_NAME: ${{ inputs.service-name }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ inputs.digest }}
        run: |
          gh pr create \
            --repo "$GITOPS_REPO" \
            --head "$BRANCH" \
            --base main \
            --title "chore: update $SERVICE_NAME image" \
            --body "(cat <<EOF 
            
          ## Image Update

          **Service:** $SERVICE_NAME

          **Image:** $IMAGE

          **Digest:** $DIGEST

          This PR was automatically created by the **CI pipeline**.

          *After merge*, Argo CD will reconcile the updated Helm values."

          EOF 
          )"
          



















